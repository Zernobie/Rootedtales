# ============================================
# ROOTED TALES - GRADLE PROPERTIES
# ============================================

# Project-wide Gradle settings

# ============================================
# IDE (e.g. Android Studio) users:
# ============================================
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ============================================
# GRADLE DAEMON
# ============================================
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Configure Gradle with most optimal settings
org.gradle.configureondemand=true
org.gradle.caching=true

# Increase heap size for better build performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle build cache
android.enableBuildCache=true

# ============================================
# ANDROIDX
# ============================================
# When set to true, the Gradle plugin will automatically migrate third-party libraries to use AndroidX
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# ============================================
# KOTLIN
# ============================================
# Enable Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.js=true

# Kotlin code style
kotlin.code.style=official

# ============================================
# ANDROID BUILD FEATURES
# ============================================
# Enable R8 full mode (more aggressive optimization)
android.enableR8.fullMode=true

# Enable resource shrinking
android.enableResourceOptimizations=true

# Enable new DEX compiler (D8)
android.enableD8=true

# Disable BuildConfig generation by default (enable per module if needed)
android.defaults.buildfeatures.buildconfig=true

# Disable ViewBinding by default (enable per module if needed)
android.defaults.buildfeatures.viewbinding=false

# ============================================
# CAPACITOR
# ============================================
# Capacitor configuration
capacitorVersion=6.0.0

# ============================================
# APP SIGNING (NEVER COMMIT TO GIT!)
# ============================================
# These values should be in a separate keystore.properties file
# or use environment variables in CI/CD

# Example (DO NOT COMMIT ACTUAL VALUES):
# MYAPP_UPLOAD_STORE_FILE=../rooted-tales.keystore
# MYAPP_UPLOAD_STORE_PASSWORD=your_keystore_password
# MYAPP_UPLOAD_KEY_ALIAS=rooted-tales
# MYAPP_UPLOAD_KEY_PASSWORD=your_key_password

# ============================================
# OPTIMIZATION
# ============================================
# Enable parallel compilation
org.gradle.workers.max=4

# Enable configuration caching (Gradle 6.5+)
# org.gradle.unsafe.configuration-cache=true

# ============================================
# DEPENDENCY RESOLUTION
# ============================================
# Force resolve strategy for dependency conflicts
android.dependencyCacheDir=.gradle/caches

# ============================================
# DEPRECATED FEATURES
# ============================================
# Suppress warnings for deprecated features
android.suppressUnsupportedCompileSdk=true

# ============================================
# DEBUGGING
# ============================================
# Enable verbose logging during build (uncomment if needed)
# org.gradle.logging.level=debug

# Enable build scan
# org.gradle.buildcache.remote.enabled=false

# ============================================
# PERFORMANCE
# ============================================
# File system watching (Gradle 7.0+)
org.gradle.vfs.watch=true

# Configuration on demand
org.gradle.configureondemand=false

# ============================================
# SECURITY
# ============================================
# Disable HTTP connections (use HTTPS only)
# android.builder.sdkDownload=true
